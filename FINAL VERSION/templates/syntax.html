<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Smart Lock System</title>
        <style>
            body {background-size: cover; background-position: center; background-repeat: no-repeat; min-height: 100vh;}
            .background{background-image: url("static/BACKGROUND.png");}
            .front{background-image: url('static/FRONT.png')}
            .denied{background-image: url('static/DENIED.png')}
            .unlock{background-image: url('static/UNLOCK.png')}
            .input{width: 200px; padding: 14px 18px;
                   background: rgba(225, 225, 225, 0.15);
                   border: 1px solid rgba(225, 225, 225, 0.4);
                   border-radius: 12px;
                   color: white;
                   font-size: 16px;
                   backdrop-filter: blur(10px);
                   outline: none;}
            .input::placeholder{color: rgba(225, 225, 225, 0.7);}
            .input:focus{border-color: rgba(225, 225, 225, 0.8);
                         background: rgba(225, 225, 225, 0.2);}
        </style>
    </head>
    <body style="font-family: Copperplate Gothic Light;" class="{% block body_class %}{% endblock %}">
        {% block body %}
        {% endblock %}
    </body>
</html>
